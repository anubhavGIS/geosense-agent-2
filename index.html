<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="cesium/Widgets/widgets.css">
    <script src="cesium/Cesium.js"></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSense Agent 2.0 - 3D Digital Twin</title>
    <script type="module" crossorigin src="./assets/index-o7_Kd71M.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-I78Jil5H.css">
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="panel">
      <h1>GeoSense Digital Twin</h1>
      <div class="row">
        <button data-fly="kolkata">Kolkata</button>
        <button data-fly="dupont">Dupont Circle</button>
      </div>
      <h2>Layers</h2>
      <label><input type="checkbox" autocomplete="off" id="layer-flood" checked />
        Flood-risk zones</label>
      <label><input type="checkbox" autocomplete="off" id="layer-buildings" checked />
        LiDAR buildings</label>
      <label><input type="checkbox" autocomplete="off" id="layer-ndvi" />
        NDVI 2023</label>
      <label><input type="checkbox" autocomplete="off" id="layer-imagery" checked />
        Sentinel-2 images</label>
      <h2>Sentinel-2 year</h2>
      <div class="row" id="years"></div>
      <h2>Change hotspots</h2>
      <div class="row">
        <button data-fly="loss">Loss hotspot</button>
        <button data-fly="gain">Gain hotspot</button>
      </div>
      <h2>Legend</h2>
      <div id="legend"></div>
      <h2>Agent</h2>
      <div id="agent">waiting for the agent's first answer</div>
      <div id="status"></div>
    </div>
  </body>
</html>
