# pytest.ini - Phase 5, Exercise 4: one test configuration for the laptop and for CI.
# A test that needs more than the code carries a marker. GitHub's runner has no GPU, no
# PostGIS, none of the data files kept out of the repository, no running server and no
# model key, so the pipeline runs only the unmarked tests:
#     python -m pytest -m "not data and not live and not llm"
# On the laptop, with the database and the MCP server running, plain  python -m pytest
# runs everything; against the cloud:  set MCP_SERVER_URL=https://... && python -m pytest -m live
[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    data: needs the PostGIS database or data files that are not in the repository (models, LiDAR tile, imagery)
    live: needs the MCP server running (MCP_SERVER_URL, default http://localhost:8000)
    llm: calls the language model of AGENT_MODEL (needs its API key)
