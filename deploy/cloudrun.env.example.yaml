# cloudrun.env.example.yaml - the shape of deploy/cloudrun.env.yaml, the environment of the
# Cloud Run service geosense-backend (gcloud run deploy --env-vars-file). The real file is
# written by deploy/cloud_setup.py from .env and is git-ignored; it holds no secret either -
# DB_PASSWORD, MAPILLARY_TOKEN and the Earth Engine key file come from Secret Manager.
DB_HOST: "ep-<endpoint>.<region>.aws.neon.tech"
DB_PORT: "5432"
DB_NAME: "neondb"
DB_USER: "neondb_owner"
DB_SSLMODE: "require"
STUDY_AREA: "Kolkata"
BBOX_MIN_LON: "88.30"
BBOX_MIN_LAT: "22.45"
BBOX_MAX_LON: "88.42"
BBOX_MAX_LAT: "22.67"
GEE_PROJECT: "<earth-engine-project>"
GEE_SERVICE_ACCOUNT_KEY: "/secrets/gee/key.json"
CORS_ORIGINS: "http://localhost:5173,http://localhost:8501,http://localhost:4173,https://<user>.github.io"
MCP_ALLOWED_HOSTS: "geosense-backend-<project-number>.us-central1.run.app,geosense-backend-<hash>-uc.a.run.app"
